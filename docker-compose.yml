services:
  jamia-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: jamia-tur-raza-ghousia-mehria:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "true"
      PORT: 5000
    volumes:
      - jamia-media:/app/backend/uploads/media
    ports:
      - "${HOST_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  jamia-media:
